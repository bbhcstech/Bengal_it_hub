<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" role="img" aria-labelledby="title desc">
  <title id="title">Bengal IT Hub Logo</title>
  <desc id="desc">Gold globe emblem and bold BENGAL IT HUB text.</desc>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
    <filter id="goldDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Side: Globe Emblem with Arch -->
  <g transform="translate(10, 2)">
    <!-- Top Arch -->
    <path d="M 12 42 A 38 38 0 0 1 78 42" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#goldDrop)"/>
    <path d="M 8 46 L 13 40 M 82 46 L 77 40" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Globe Circle & Tech Grid -->
    <g fill="none" stroke="url(#goldGrad)" filter="url(#goldDrop)">
      <circle cx="45" cy="45" r="28" stroke-width="2.5"/>
      <path d="M 19 37 Q 45 47 71 37" stroke-width="1.8"/>
      <path d="M 17 45 Q 45 56 73 45" stroke-width="2"/>
      <path d="M 20 53 Q 45 62 70 53" stroke-width="1.8"/>
      
      <path d="M 45 17 Q 30 45 45 73" stroke-width="1.6"/>
      <path d="M 45 17 Q 60 45 45 73" stroke-width="1.6"/>
      
      <!-- Nodes -->
      <g fill="url(#goldGrad)" stroke="#0b1724" stroke-width="1">
        <circle cx="30" cy="38" r="2.5"/>
        <circle cx="60" cy="35" r="2.5"/>
        <circle cx="23" cy="45" r="2.5"/>
        <circle cx="50" cy="51" r="2.5"/>
        <circle cx="67" cy="46" r="2.5"/>
        <circle cx="37" cy="57" r="2.5"/>
      </g>
    </g>
  </g>

  <!-- Right Side: Brand Typography -->
  <g font-family="'Outfit', 'Manrope', 'Plus Jakarta Sans', 'Arial Black', sans-serif">
    <!-- BENGAL Text -->
    <text x="108" y="52" fill="url(#goldGrad)" font-size="40" font-weight="900" letter-spacing="3.5" filter="url(#goldDrop)">BENGAL</text>
    
    <!-- Underline Bar -->
    <path d="M 108 60 H 325" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- IT HUB Subtext with Flank Lines -->
    <path d="M 108 77 H 155 M 278 77 H 325" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="216" y="82" fill="currentColor" class="bih-logo-text-sub" font-size="18" font-weight="900" letter-spacing="7" text-anchor="middle">IT HUB</text>
  </g>
</svg>
