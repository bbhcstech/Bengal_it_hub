<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Bengal IT Hub Logo</title>
  <desc id="desc">High contrast 3D Metallic Gold Globe Emblem with BENGAL IT HUB Typography visible on both light and dark backgrounds.</desc>
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="25%" stop-color="#E5B834"/>
      <stop offset="60%" stop-color="#997008"/>
      <stop offset="85%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>

    <!-- Deep Metallic Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <!-- 3D Bevel & Strong High-Contrast Drop Shadow -->
    <filter id="embossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#050C14" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#embossShadow)">
    <!-- 1. Outer Top Arch with Flared Winglets -->
    <path d="M 28 92 A 72 72 0 0 1 172 92" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 20 102 L 28 90 M 180 102 L 172 90" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- 2. Globe Sphere & Tech Circuit Grid -->
    <g fill="none" stroke="url(#goldGrad)">
      <!-- Outer Circle -->
      <circle cx="100" cy="88" r="46" stroke-width="4.5"/>
      
      <!-- Latitudes -->
      <path d="M 58 74 Q 100 88 142 74" stroke-width="3.2"/>
      <path d="M 55 88 Q 100 104 145 88" stroke-width="3.8"/>
      <path d="M 60 102 Q 100 116 140 102" stroke-width="3.2"/>
      
      <!-- Longitudes -->
      <path d="M 100 42 Q 74 88 100 134" stroke-width="3"/>
      <path d="M 100 42 Q 126 88 100 134" stroke-width="3"/>

      <!-- Tech PCB Circuit Nodes -->
      <g fill="url(#goldGrad)" stroke="#091420" stroke-width="1.5">
        <circle cx="78" cy="76" r="3.8"/>
        <circle cx="122" cy="72" r="3.8"/>
        <circle cx="68" cy="88" r="3.8"/>
        <circle cx="110" cy="96" r="3.8"/>
        <circle cx="132" cy="88" r="3.8"/>
        <circle cx="88" cy="106" r="3.8"/>
        <circle cx="100" cy="58" r="3.8"/>
      </g>
    </g>

    <!-- 3. Double Gold Base Line Under Globe -->
    <path d="M 14 138 H 186" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 14 143 H 186" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 4. BENGAL Title Text with Sharp Contrast Outline -->
    <text x="100" y="166" fill="url(#goldTextGrad)" stroke="#091420" stroke-width="1.2" stroke-linejoin="round" class="bih-logo-main-text" font-family="'Outfit', 'Manrope', 'Arial Black', sans-serif" font-size="27.5" font-weight="900" letter-spacing="3" text-anchor="middle">BENGAL</text>

    <!-- 5. Gold Separator Line under BENGAL -->
    <path d="M 14 173 H 186" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 6. IT HUB Subtitle Text with Flank Lines -->
    <path d="M 14 185 H 56 M 144 185 H 186" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="100" y="189" fill="url(#goldTextGrad)" stroke="#091420" stroke-width="0.8" stroke-linejoin="round" class="bih-logo-text-sub" font-family="'Outfit', 'Manrope', 'Arial Black', sans-serif" font-size="13.5" font-weight="900" letter-spacing="4" text-anchor="middle">IT HUB</text>
  </g>
</svg>
