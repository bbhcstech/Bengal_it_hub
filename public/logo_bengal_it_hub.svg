<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Bengal IT Hub logo</title>
  <desc id="desc">A blue technology globe mark above the words Bengal IT Hub on a transparent background.</desc>
  <defs>
    <linearGradient id="logoFill" x1="160" y1="48" x2="478" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ffcff"/>
